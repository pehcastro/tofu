id: formal_first
domain: qa
also_reaches: work_on_tests
kind: human
concern: code_rules
condition: (?i)\b(concurren\w*|race[sd]?|deadlock\w*|mutex\w*|locks?|locking|goroutines?|threads?|async|parallel\w*|atomic\w*|state machine|invariants?|retry|retries|idempoten\w*|consisten\w*|distributed|queues?|ordering|protocol)\b
source: library/qa/references/formal-verification.md
evidence: a stop-check test failed 3 of 20 plain runs and 20 of 20 under -race, go1.27.1 windows/amd64, and had passed on other builds of the same tree. The loop ran each shadow gate decision on its own goroutine and the test gate appended to one slice with no lock, so one ordering lost an append. An earlier -race run of the command package found five data races failing three tests whose plain runs passed, all from one root: an emit callback ran on two goroutines and after its loop had returned
text: before testing code where order or shared state matters, write in plain words the states, the atomic steps between them, one invariant that must hold in every state and one thing that must eventually happen, and agree with the person that those are what verified means here. then check it two ways: a bounded model or a property test over small sizes, and a driven run of the real thing. say what each proved and what neither did.
notes: a passing run shows one ordering; a race or a stuck state lives in another. writing the invariant and the eventually first gives the person something to agree to, and gives the bounded check a target. it guards against concurrency bugs that every example test passes.
