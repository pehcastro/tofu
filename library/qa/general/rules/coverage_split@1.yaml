id: coverage_split
domain: qa
kind: human
concern: code_rules
text: report test coverage per kind: requirements, risks, external behaviours, scenarios and non functional targets, each with its own count and its own list of what is not covered. never collapse them into one percentage, and never mix in code coverage.
notes: one coverage percentage hides which requirements, risks and behaviours are untested. it guards against a single healthy-looking number over missing kinds of coverage, and code coverage standing in for test design.
