id: test_assertion
domain: qa
kind: structural
concern: code_rules
checker: test_assertion
mode: shadow
scope: "**/*_test.go"
text: every test calls the code the way its users do and asserts a specific literal value. NEVER let a test's only claims be that something is not nil, not empty, not zero or returned no error, since they pass on almost any value: compare what the code produced against what it should produce. an expected value computed by the code under test, or a constant restated from the code, proves nothing either.
notes: a claim is an if whose body calls t.Fatal or t.Error, or an assert or require call. A claim is existential when it fails on a value being nil, zero or empty, when it fails on a comma ok flag, or when it calls Nil, NotNil, Empty, NotEmpty, Zero, NotZero, IsType, Implements, Error or NoError. A guard that fails on err != nil is setup and is not counted as a claim at all. The rule fires on a test function that makes at least one claim and not one claim about a specific value. the call made the way users make it, the self-referential expected value and the constant pin are in the text only, because the checker does not detect them.
