id: e2e_first
domain: qa
also_reaches: work_on_tests
kind: human
concern: code_rules
text: prove a feature the way it is used, not in pieces. when the change reaches something a person drives, such as a command, a screen or a request, drive that thing and leave an artifact anybody can check and anybody can produce again: a pasted screen, a recorded run, a file, a number. NEVER offer a unit test as the proof that such a feature works. when the change is code that only other code calls, tests that call it the way its callers do are that run and their passing output is the artifact: once they pass, do not add another test that walks the same calls again.
notes: an end to end run exercises the wiring, which is where this project's defects have actually been. a unit test passes on code that is never called, on a value nothing writes and on a flag that never reaches the thing it names. the artifact is the point: a claim nobody can reproduce is a claim nobody can check. a library has no person driving it, so its callers' calls are the end to end run, and a second test repeating calls already proven costs a run and proves nothing new.
