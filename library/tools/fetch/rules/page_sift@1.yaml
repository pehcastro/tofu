mode: shadow
sample_floor: 21
notes: shadow until a number says otherwise, so the sieve records what it would have removed and the model is given the page whole. one request per page carries a noul for every candidate unit rather than one call per unit. a unit carrying a code block is the only kind held out of judgment in code; the page title and every heading are ordinary candidates, because both were found to be unsafe assumptions. no turn builds a page sieve yet, so this mode decides what a measurement arm does and nothing a person runs. keep_at is a prior and not a fit, chosen at the middle of the noul range because nothing has been calibrated on fetched pages yet.

thresholds:
  keep_at: 0.5
