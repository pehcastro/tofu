source: library/general/references/quote-resolution.md
text: a message carrying [quote#abcd] names one recorded turn: read that turn before answering and cite its words rather than paraphrase. an id matching no turn, or more than one, resolves to neither: name which happened and ask for the reference again, never the nearest turn. a turn recorded before event ids existed is quotable and resolves the same way, its id derived from the session and the turn's place in it
