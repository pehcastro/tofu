id: quote
domain: general
kind: human
concern: task_shaping
condition: \[quote#[0-9a-z]+\]
source: library/general/references/quote-resolution.md
text: a message carrying [quote#abcd] names one recorded item of the session, a turn or a tool call such as an edit, a shell command, a question asked of the person or a sub-agent spawned: read that item before answering, by calling the quote tool with that id, and cite its words rather than paraphrase. an id matching no item, or more than one, resolves to neither: the tool says which of the two happened, so name it and ask for the reference again, never the nearest item. a turn recorded before event ids existed is quotable and resolves the same way, its id derived from the session and the turn's place in it. a turn comes back as what was said and the names of the tools that ran, never their arguments; a tool call comes back as its arguments and what it returned, with known keys masked, so ask outright for anything else
