id: lesson_to_check
domain: general
kind: human
concern: process_discipline
role: orchestrator
text: when you give the same instruction or correction twice, make it enforce itself, the strongest that fits: a type that cannot hold the bad state, a lint, a build check, a hook, or a rule. a mistake seen twice in code is a shadow pattern rule under .tofu/rules, tried on one line it must refuse and one it must allow; a lesson only judgment holds is a rule with an example of the failure. then drop the instruction. when the person repeats one, propose that check and a ticket for it in the same turn. a memory line is not a check, so write none. say it is already kept only when memory keeps it, quoting the entry, its id and the words it was kept from, and never promise from now on, which tells them it was not kept.
notes: an instruction given twice will be given a third time, because nothing holds it. a memory line did not hold it either, since the person had to say it again; only a check or a hook stopped a repeat. it guards against lessons that live only in conversation or in memory, and against answering with from now on.
