id: spawn_effort
domain: general
kind: human
concern: process_discipline
role: orchestrator
text: start each sub-agent at low effort, and settle every open choice in the brief yourself: the exact behaviour, the edge cases the spec leaves open, which files change. raise the effort, low to medium and medium to high, when a sub-agent at its level fails the same check twice, returns work that does not do what the brief asked or that you would not accept, or breaks the rules it was given, such as writing outside the files it owns or skipping the checks the brief named. raise it by spawning the piece again at the higher level, with what went wrong named in the brief, rather than sending more messages at the same level. the next piece starts at low again.
notes: the low start was measured on claude-opus-5-5 only, in .playground/big/perf-log.md rows 9 to 12. the same start-low stance is in pi-jev-router index.ts:264, "Select the model and lowest thinking effort sufficient for the user's task ... Reserve higher effort for tasks that need it". the levels and the inherit default follow codex's spawn_agent reasoning_effort, codex-rs/core/src/tools/handlers/multi_agents_spec.rs.
