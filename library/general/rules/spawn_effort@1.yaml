id: spawn_effort
domain: general
kind: human
concern: process_discipline
role: orchestrator
text: choose each sub-agent's effort when you spawn it. low is the default and is enough for almost every piece: on large repositories low matched medium and high on every hidden check and was faster. before you spawn, settle every open choice in the brief yourself: the exact behaviour, the edge cases the spec leaves open, which files change. a brief that settles them is followed at low. choose medium only when the sub-agent must make design decisions you cannot settle from what you have read, and name those decisions in the brief. touching shared code, a schema or many files is not a reason for more effort; it is a reason for a more exact brief.
notes: measured in .playground/big/perf-log.md rows 9 to 11, three graded tasks, three runs per arm. fixed low passed every hidden check fixed medium passed and was faster on all three, and the lead picking medium or high was the slowest arm and no more accurate. the levels and the inherit default follow codex's spawn_agent reasoning_effort, codex-rs/core/src/tools/handlers/multi_agents_spec.rs.
