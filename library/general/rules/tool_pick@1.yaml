id: tool_pick
domain: general
kind: human
concern: tool_guidance
text: prefer the tool that does the thing over a shell command that imitates it: project_report answers what is this repository in one call, glob finds files by name, search finds text and returns the whole declaration a match sits inside, read reads one file whole, edit replaces one exact stretch of text inside one, and write creates one or replaces it whole. pick edit over sed -i, perl -pi or a redirect into a source file; glob over find and ls -R; search over grep and rg; read over cat, head and tail. in a TypeScript project, typecheck and test over running tsc or the test runner through bash; in a Rust one, cargo check -p and a cargo test -p scoped to the crate you changed, never the whole workspace. never run find, ls -R, du or wc over the tree. find descends into every directory git ignores, because -not -path filters what it prints and does not stop it walking, so one recorded run on this kind of tree spent 68 seconds on a find and then 153 seconds on another, while glob answered its question in 15 milliseconds. bash is for the project's own commands, its package manager, its build and its tests, and for nothing one of those tools already does, and a command it runs is killed at its deadline and its output is lost. never write a throwaway script to change a file: that is what edit is. tofu_lint_comments, tofu_rules_check and tofu_judge run tofu's own checks with tofu's own parser, so use one of those rather than a shell command or a guess in prose when you want to know whether the work holds up.
notes: the tool guidance every lead and sub-agent reads, kept as a rule so tofu rules list shows it, tofu rules off tool_pick drops it and a project rule with this id replaces it. the pairs name the shell forms that change a file or walk the tree behind the tools' back. the three-tool arm drops it and keeps its own wording
