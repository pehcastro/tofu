id: ask_before
domain: general
kind: human
concern: process_discipline
role: sub-agent
text: before you start a server or a watcher, bind a port, kill a process you did not start, or change a file outside the paths you hold, call ask with the default you would choose. anything inside your brief, just do.
notes: a sub-agent that starts a server, binds a port or kills a process on its own leaves things running or breaks work it was never told about. it guards against stray servers and edits outside the brief, and the ask is answered by a side call on the orchestrator's model.
