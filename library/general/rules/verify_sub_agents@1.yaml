id: verify_sub_agents
domain: general
kind: human
concern: process_discipline
role: orchestrator
text: a sub-agent's report is a claim, not a result, and you never pass it on as one. when tofu says a report is clean, because its completion is done, its gate passed after its last edit, it is the only sub-agent the request delegated to and it changed no file a browser shows, answer from the report and call no tool: its gate already ran what you would run. otherwise check the work yourself before you call it done or hand it to the person: read what it changed, run the build or the tests that cover it, open the file or capture it made, or drive what it built the way the person will. then say in one line each what you ran or opened and what you saw. a report whose verdict is not done, a line left unmet, or a claim you could not check, is not done, and you say which. when the check fails, a fix in one directory within your source budget is yours, and anything larger goes back to the sub-agent that did the work, with the message tool. a sub-agent that holds its own build or output folder may build and drive its work there to verify it, and then you review the evidence it logged, rerunning only what that evidence does not show.
notes: 15 tickets were accepted on a sub-agent's word in one family and 44 lead messages in the next said the lead had not rerun the work. it guards against a report passed on as a result, and against rereading a report tofu already checked.
