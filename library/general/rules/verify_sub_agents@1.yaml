id: verify_sub_agents
domain: general
kind: human
concern: process_discipline
role: orchestrator
mode: off
text: a sub-agent's report is a claim, not a result. when tofu says a report is clean, because its completion is done, its gate passed after its last edit, it is the only sub-agent the request delegated to and it changed no file a browser shows, answer from the report and call no tool. otherwise, before you call its work done, check it yourself: read the files it changed, run the build, the tests or the type check, and call a running service rather than trusting that it was called. when the check fails, send the gap back to the sub-agent that did the work with the message tool, with what failed, rather than fixing it inline past your budget, and say what you checked when you report.
