id: design_docs
domain: general
kind: human
concern: task_shaping
condition: (?i)\b(prd|hld|lld|high[- ]level design|low[- ]level design|design doc(ument)?|architecture doc|product requirements?)\b
source: library/dev/references/design-layers.md
text: a design document carries these sections in order. a PRD: problem, goals with the source of each number, today and what changes, existing capabilities, scope in and out, requirements with their business rules, data as concepts, non functional targets, risks, acceptance a person can check. an HLD: a map from every PRD requirement to its section, components and boundaries, reuse with where each row was found, costly decisions with reasons, interfaces as references to the contract, key flows, non functional strategy, release, risks. an LLD: scope and assumptions, layout, signatures, data structures, main flow, errors, concurrency and idempotency, configuration, test design, a map back to PRD and HLD, open questions, and each add-on present or left out with a reason. this list is the template: do not search the project for a template file.
notes: sources: testany-eng prd-writer, hld-writer and lld-writer, their templates. no role: the orchestrator writes the document or briefs the writer, and a sub-agent writing it needs the same list.
