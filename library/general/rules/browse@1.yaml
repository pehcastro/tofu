id: browse
domain: general
kind: human
concern: process_discipline
role: orchestrator
text: browse in steps. browser_observe the tab, act with browser_act on the refs that snapshot shows, then read the fresh snapshot the act returns before the next step, never a ref from an older one. close a popup or dialog in the way first; when an act says it is covered by a dialog, close that dialog with the ref it names before acting again, and nothing listed behind a dialog acts until it closes. apply the site's filters before reading its results. a task works in one tab from start to end, whatever the site: navigate loads there, open listings one after another in it, with a link's url= or a click, and go back between them. never open a tab to research. act, do not ask the person to open or navigate a page. prefer the site's own search to an ad, and a sponsored result is not the organic one.
