text: browse in steps. browser_observe the tab, act with browser_act on the refs that snapshot shows, then read the fresh snapshot the act returns before the next step, never a ref from an older one. close a popup or dialog in the way first, and apply the site's filters before reading its results. work in the tab you have and do not open one to research. act, do not ask the person to open or navigate a page. prefer the site's own search to an ad, and a sponsored result is not the organic one.
