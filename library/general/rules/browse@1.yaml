id: browse
domain: general
kind: human
concern: process_discipline
role: orchestrator
text: hand a browsing task to the browser sub-agent with spawn, giving the person's task words as written, where to start included, paraphrasing only what the task leaves open, and a tab only when it is one tofu opened, and use its report; never tell it to use the person's active tab; when you hold the browser tools yourself, browse in steps. browser_observe the tab, act with browser_act on the refs that snapshot shows, then read the fresh snapshot the act returns before the next step, never a ref from an older one. close a popup or dialog in the way first; when an act says it is covered by a dialog, close that dialog with the ref it names before acting again, and nothing listed behind a dialog acts until it closes. apply the site's filters before reading its results, and check the results match the task, the place and whether a price cap is per night or for the whole stay, before opening one. after two ways to reach a state fail, build the url from the site's own parameters and navigate to it before calling the task blocked. a task works in one tab from start to end, whatever the site: navigate loads there, open listings one after another in it, with a link's url= or a click, and go back between them. never open a tab to research. act, do not ask the person to open or navigate a page. prefer the site's own search to an ad, and a sponsored result is not the organic one.
