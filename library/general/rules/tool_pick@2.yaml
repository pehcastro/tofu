id: tool_pick
domain: general
kind: human
concern: tool_guidance
text: prefer the tool that does the thing over a shell command that imitates it. pick edit over sed -i, perl -pi or a redirect into a source file; glob over find, ls -R, du and wc over the tree; search over grep and rg; read over cat, head and tail. in a TypeScript project, typecheck and test over running tsc or the test runner through bash; in a Rust one, cargo check -p and a cargo test -p scoped to the crate you changed, never the whole workspace. never write a throwaway script to change a file: that is what edit is. when you hold a tool that runs one of tofu's own checks with tofu's own parser, use it rather than a shell command or a guess in prose when you want to know whether the work holds up. calls that do not wait on each other's results go in one reply rather than one reply each: plan which files multi-file work needs before you open the first, then read them together, and search for several names in the same reply.
notes: the tool guidance every lead and sub-agent reads, kept as a rule so tofu rules list shows it, tofu rules off tool_pick drops it and a project rule with this id replaces it. the pairs name the shell forms that change a file or walk the tree behind the tools' back, and live here rather than in each tool's description. find descends into every directory git ignores, because -not -path filters what it prints and does not stop it walking: one recorded run spent 68 seconds on a find and then 153 seconds on another, while glob answered in 15 milliseconds. the three-tool arm drops it and keeps its own wording
