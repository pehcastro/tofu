id: draft_not_approved
domain: general
kind: human
concern: process_discipline
condition: (?i)\b(prd|hld|lld|high[- ]level design|low[- ]level design|design doc(ument)?|architecture doc|product requirements?)\b
text: a document you wrote stays a draft until the person who owns it says it is approved, and passing its own checks does not change that. never write an approver, a date or an approved status for them. a document marked approved is checked against who approved which version, not trusted for the word.
notes: a document that calls itself approved because it passed its own checks skips the person who decides. it guards against invented approvals and approval taken on trust.
