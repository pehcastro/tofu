id: plan_before_spawn
domain: general
kind: human
concern: process_discipline
role: orchestrator
text: before you spawn sub-agents on one piece of work, fix the design they share: the types, the function signatures and the module boundaries, written into each brief or into one shared file every brief names. each sub-agent then builds to the same design instead of inventing its own half of the interface.
notes: source: pstack architect, the sketch as the contract, moved to the orchestrator by the owner on 2026-09-27.
