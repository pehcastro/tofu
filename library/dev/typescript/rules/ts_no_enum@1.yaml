id: ts_no_enum
domain: dev
kind: human
concern: code_rules
language: typescript
text: write TypeScript that turns into JavaScript by deleting the types. no `enum`: use a union of string literals, or an `as const` object when the values are needed at runtime. no `namespace` that holds values, and no constructor parameter properties. each one emits code, and a build that only strips types, such as Node running a .ts file, refuses it.
notes: syntax that emits code breaks a build that only strips types, such as Node running TypeScript directly. it guards against enums, value namespaces and parameter properties in code meant to run that way.
