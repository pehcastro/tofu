id: vue_router_guards
domain: dev
kind: human
concern: code_rules
framework: vue
text: a navigation guard returns its decision: nothing or `true` to continue, `false` to cancel, a route location to redirect, and it awaits any check before it returns. new code never takes the third `next` argument, which hangs the navigation when a branch forgets to call it and misroutes when a branch calls it twice. a redirect to the sign-in route skips the sign-in route itself, or the guard loops. a guard in the browser decides what to show; the server still checks every request. `beforeRouteEnter` runs before the component exists, so it has no `this`. Vue Router warns `The "next" callback was never called` and `was called more than once`, eslint-plugin-vue's `no-this-in-before-route-enter` checks for `this` there, and a test opens a guarded route signed out and asserts it reaches the sign-in page in one redirect.
notes: a guard that uses next can hang a navigation or run it twice, and a sign-in redirect that does not skip itself loops forever. it guards against stuck and looping navigations and a client guard trusted as security.
