id: vue_script_setup
domain: dev
kind: human
concern: code_rules
framework: vue
text: a Vue 3 component is written with the Composition API in `<script setup lang="ts">`, unless the project is written in the Options API, where new code follows the project. declare props and events by type, `defineProps<{ title: string; count?: number }>()` and `defineEmits<{ save: [id: string] }>()`, with defaults through `withDefaults`. never import `defineProps`, `defineEmits` or another macro, which the compiler provides; never `export` from `<script setup>`; set the name and `inheritAttrs` with `defineOptions`. a parent reaches into a child only through what `defineExpose` lists, and only for an imperative action such as focus. eslint-plugin-vue checks this with `component-api-style` set to `["script-setup"]`, `define-props-declaration` and `define-emits-declaration` set to `type-based`, `no-import-compiler-macros`, `prefer-define-options`, and the essential `no-export-in-script-setup`, `valid-define-props` and `valid-define-emits`.
notes: sources: vuejs-ai vue-best-practices, its workflow and component-data-flow reference; antfu skills vue, preferences and script-setup-macros; the rule list, options and categories as eslint-plugin-vue 10.11 ships them.
