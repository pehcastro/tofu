id: vue_list_keys
domain: dev
kind: human
concern: code_rules
framework: vue
text: every `v-for` has a `:key` from the data, a database id or a slug, unique among its siblings, and never the index for a list that is reordered, filtered or inserted into, which hands one row's state and focus to another. never put `v-if` on the element that carries `v-for`: loop over a `computed` that already filtered, or put the `v-if` on a child. on a `<template v-for>` the key goes on the `<template>`. eslint-plugin-vue's essential `require-v-for-key`, `valid-v-for`, `no-use-v-if-with-v-for` and `no-v-for-template-key-on-child` check this, a development build warns `Duplicate keys found during update`, and a test types into the second row, reorders the list, and asserts the text moved with its row.
notes: sources: vuejs-ai vue-best-practices, the sfc reference on list and conditional rendering; the duplicate key warning as @vue/runtime-core 3.5 ships it; the rule categories as eslint-plugin-vue 10.11 ships them.
