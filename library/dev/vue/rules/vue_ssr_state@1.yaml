id: vue_ssr_state
domain: dev
kind: human
concern: code_rules
framework: vue
text: in a server-rendered Vue or Nuxt app, one module instance serves every request, so a `ref` or `reactive` at module level is shared by every visitor: in Nuxt keep it in `useState("key", () => initial)`, and in plain Vue create it per request inside the app factory. a page's first data comes from `useFetch` or `useAsyncData` with an explicit key, which fetch on the server and hand the result to the client; a bare `await $fetch()` in setup fetches twice, and `$fetch` belongs in handlers. call Nuxt composables only in setup, a plugin, a middleware or a Nuxt hook. the first client render matches the server's HTML: no `localStorage`, `window` or locale formatting during setup; read the client value in `onMounted`, or a cookie through `useCookie`. Nuxt throws `A composable that requires access to the Nuxt instance was called outside of a plugin` and Vue warns `Hydration completed but contains mismatches.`, so read the browser console on the dev server during the first load and treat any error or warning there as a failure.
notes: module state on the server is shared by every visitor, and a first client render unlike the server's HTML is thrown away. it guards against data leaking between users, double fetches and hydration mismatches.
