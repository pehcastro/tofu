id: vue_no_v_html
domain: dev
kind: human
concern: code_rules
framework: vue
text: text from a person, a request or a file is rendered with `{{ }}`, which escapes it, never with `v-html`, which inserts it as markup and runs any script an event attribute in it carries. HTML that must render, such as converted markdown, passes through a sanitiser such as DOMPurify in the same module that hands it to `v-html`. eslint-plugin-vue's recommended `no-v-html` flags every use, so each one kept is a reviewed line with the sanitiser beside it.
notes: sources: vuejs-ai vue-best-practices, the sfc reference on template safety; the no-v-html rule as eslint-plugin-vue 10.11 ships it.
