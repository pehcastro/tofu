id: vue_props_down_events_up
domain: dev
kind: human
concern: code_rules
shapes: design
framework: vue
text: props go down and events come up. a child never assigns to a prop or to a field of a prop object: it emits an event, or keeps a local copy named as one. a two-way contract is `defineModel()`, from Vue 3.4, used only where the parent binds it with `v-model`. declare every event the component emits with its payload type, and re-emit a grandchild's event by hand, since component events do not bubble. a value several levels down goes through `provide` and `inject` with a typed `InjectionKey`, and only the provider changes it. a parent asks a child for data through a prop or an event, never a template ref. eslint-plugin-vue's essential `no-mutating-props` and strongly recommended `require-explicit-emits` check this, and a development build warns `Component emitted event ... but it is neither declared in the emits option`.
notes: a child that writes its parent's data makes the flow impossible to follow and breaks one-way updates. it guards against mutated props, undeclared events and parents reaching into a child.
