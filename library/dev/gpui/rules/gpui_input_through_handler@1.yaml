id: gpui_input_through_handler
domain: dev
kind: human
concern: code_rules
framework: gpui-ce
touches: (?i)input|field|textbox|editor|composer|caret|cursor|\bime\b|key|shortcut|hotkey|binding|action|focus|tab stop|typing|paste|search box
text: in gpui-ce, text input goes through `EntityInputHandler`, registered in paint with `window.handle_input(&focus_handle, ElementInputHandler::new(bounds, entity), cx)`, never `on_key_down` with `key_char`, which runs after the bindings and sees no IME; its ranges are UTF-16 offsets. shortcuts are `actions!` bound with `KeyBinding::new(keys, action, Some(context))` and handled with `.on_action` under a matching `.key_context`, and they match only on the path from the root to the focused element. keys with nothing focused, or with a handle no rendered element `track_focus`es, go to the root alone. `track_focus` on an ancestor takes focus on every click inside it, and a root `capture_key_down` that stops propagation swallows every key. focus a view you just built through `Focusable` from `window.defer`, and only on a transition: `window.focus` refreshes the whole window. on Windows, Shift with a digit or punctuation arrives as the shifted character, so bind `!`, never `shift-1`. a preview draws no caret and holds no focus. the gpui-input-and-focus reference has each fact with its source line.
notes: desk input defects were each one gpui fact relearned after a failed round: a root track_focus that refocused the book, keys typed through key_char, shortcuts stolen by an ancestor. it guards against fields that ignore IME, dead shortcuts and focus that moves on its own.
