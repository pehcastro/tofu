id: verify_scoped
domain: dev
kind: human
concern: process_discipline
text: check a change in seconds, not with a whole build. in a go, rust, python or typescript project, typecheck with the typecheck tool, never a build, cargo check, mypy, tsc or another typecheck command through the shell. a typecheck still warming waits for its first check, so never sleep and poll through the shell: call typecheck again. on a large project an edit or a write returns before its check finishes, so make the whole batch of edits, then call typecheck once for the batch. run only the tests that cover the files you changed, with the test tool in a go, rust, python or typescript project, given the test file or the changed source file, never go test, cargo test, pytest or vitest through the shell. run a whole suite only when asked. never add Playwright or another browser test runner to a project that does not already have one: check what the browser shows on the dev server through tofu's browser tools.
notes: a whole build or suite after every edit costs minutes the work does not need and slows the machine for everyone, and a new test runner changes the project's own config and dependencies. it guards against workspace-wide checks, sleep and poll loops, and tooling added to check one change. version 2 drops the shell commands for rust and the other languages: the typecheck and test tools cover go, rust, python and typescript since TOOLS1, and two rust sessions ran cargo test through the shell because version 1 told them to.
