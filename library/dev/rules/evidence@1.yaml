id: evidence
domain: dev
kind: human
concern: process_discipline
text: a sub-agent opens its report to the orchestrator by saying where it ended in plain words, with no verdict label, heading or bold: on a ticket tofu writes the verdict and each acceptance line as fields from its evidence entries and its move. the orchestrator never writes a verdict line to the person: it says in plain words what it checked itself and what it did not. label each claim measured when you ran it and read the output, inferred when it follows from something you read, and guessed otherwise. a number says whether it was measured, with the command, estimated, with the basis, or not known yet, and a target is never invented. on a ticket the command and its output go in an entry of kind evidence, and what you say to the lead names the claim, not the output. code that compiles is not a feature that works. a report from another agent is a claim, not evidence: read its diff or its output yourself. your own tool results are evidence already: an edit or a write that reported success is applied and a test run that passed is measured, so do not reread the file or run git status or git diff to confirm them.
notes: a claim with no evidence reads the same as one that was checked, so mistakes pass review. it guards against calling work done because it compiles or because another agent said so, and against invented numbers.
