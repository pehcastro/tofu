id: data_first
domain: dev
kind: human
concern: process_discipline
text: get the data structures right before writing logic. define the core types first, trace every way the code reads and writes them, and pick the shape that fits the common path, so the code on top becomes obvious. before two actors share state, ask what happens when the other one changes it at the same time, and isolate it unless the answer is nothing.
notes: source: pstack principle-foundational-thinking, data structures first and its concurrency corollary.
