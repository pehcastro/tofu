id: refactor
domain: dev
kind: human
concern: process_discipline
condition: (?i)\b(refactor|rename|inline)|\bextract(?:s|ed|ing)?\s+(?:(?:a|an|the|this|that|these|those|it|its|them|out|new|shared|common)\s+)*(?:\w+\s+)?(?:function|method|component|hook|module|type|variable)s?\b|\bextract\w*\b[^.,;\n]{0,60}?\binto\s+(?:(?:a|an|its|their|own|new|separate)\s+)*(?:\w+\s+)?(?:function|method|component|hook|module|type|variable)s?\b
text: a refactor changes structure and never behaviour. before anything moves, pin what the code does now on the real thing: a recorded run, a command's output, a snapshot you compare against afterwards. a type check or a lint pass is not a pin. keep the change only if a reader now needs fewer layers or less state to follow the code, and revert it otherwise.
notes: a refactor with no pinned behaviour cannot show it changed nothing, and one that adds layers is not an improvement. it guards against behaviour slipping in under the name of cleanup.
