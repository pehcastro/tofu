id: verify_scoped
domain: dev
kind: human
concern: process_discipline
text: check a change in seconds, not with a whole build. typecheck with the typecheck tool, never a build or a workspace-wide typecheck command. run only the tests that cover the files you changed: vitest related <files>, go test -run, pytest <path>. run a whole suite only when asked.
notes: sources: tofu's own. no harness states this as a rule; opencode's lsp tool text only lists operations.
