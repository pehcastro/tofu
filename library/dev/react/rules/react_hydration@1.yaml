id: react_hydration
domain: dev
kind: human
concern: code_rules
framework: react
text: in a server-rendered app the first client render matches the server's HTML. never format a date, a time or a number by locale or timezone, read `window`, `localStorage` or `matchMedia`, or branch on `typeof window` during render: render a stable value first, or read the client value through `useSyncExternalStore` with a server snapshot, and apply a theme that must not flash from a small inline script before hydration. `suppressHydrationWarning` goes only on the one element whose text is expected to differ, such as a timestamp, never to quiet a real mismatch. an input never loses its focus or its typed value when hydration finishes. a Playwright test opens the page in a context with a `timezoneId` and a `locale` unlike the server's and fails on any console error, which catches React's `Hydration failed because the server rendered` and `A tree hydrated but some attributes of the server rendered HTML didn't match`.
notes: sources: the Vercel web interface guidelines, hydration; Vercel react-best-practices rendering-hydration-no-flicker and rendering-hydration-suppress-warning; react.dev, You Might Not Need an Effect, on a server snapshot for an external store; the hydration messages as react-dom 19 prints them.
