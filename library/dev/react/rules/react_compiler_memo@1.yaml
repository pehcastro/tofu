id: react_compiler_memo
domain: dev
kind: human
concern: code_rules
framework: react
text: under the React Compiler, write plain code and let it memoise: add no `useMemo`, `useCallback` or `memo` by default, and leave an existing one in place unless a test covers its removal, because removing it changes the compiled output. without the compiler, memoise only what a React DevTools Profiler recording shows is slow, or a value an effect or a `memo` child compares. a `useMemo` returns a value and has no side effect. each compiler diagnostic marks a component the compiler skipped: fix what it names rather than wrapping the component in memoisation. eslint-plugin-react-hooks reports `preserve-manual-memoization` and `use-memo`, and `exhaustive-deps` covers the list.
notes: hand-written memoisation is noise under the compiler and often wrong without it, while removing it carelessly changes behaviour. it guards against memoising by habit and hiding a compiler bailout behind a wrapper.
