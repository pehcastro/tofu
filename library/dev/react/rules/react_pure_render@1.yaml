id: react_pure_render
domain: dev
kind: human
concern: code_rules
framework: react
text: a component and a hook return the same output for the same props, state and context, and change nothing while rendering. never call `Math.random()`, `Date.now()`, `new Date()`, `crypto.randomUUID()` or `performance.now()` in the render body: take the value once with `useState(() => ...)`, or in an effect or a handler. never assign to a module variable or to `window` during render. never read or write `ref.current` during render, except to fill an empty ref once; a value the screen shows belongs in state. never call a state setter unconditionally while rendering. eslint-plugin-react-hooks reports these as `purity`, `globals`, `refs` and `set-state-in-render`, and Strict Mode renders every component twice in development to expose the rest.
notes: sources: react.dev, Components and Hooks must be pure, on idempotence and side effects outside render; the purity, globals, refs and set-state-in-render lint pages.
