id: react_events_not_effects
domain: dev
kind: human
concern: code_rules
framework: react
text: work caused by one interaction runs in that interaction's handler: the POST on submit, the toast after a purchase, the parent's `onChange` after a toggle, the dependent field cleared after a choice. never set a flag in the handler for an effect to notice, and never chain effects that each set state for the next. an effect exists only to keep the component in step with a system outside React while it is on screen. setup that runs once per app load goes in the entry module, not in an effect with an empty list. a test renders the component inside `<StrictMode>`, which runs every effect twice in development, presses the control once, and asserts the request or the callback ran exactly once.
notes: work sent through an effect runs at the wrong time, runs twice under Strict Mode and is hard to follow. it guards against duplicated requests, chains of effects and setup repeated on every mount.
