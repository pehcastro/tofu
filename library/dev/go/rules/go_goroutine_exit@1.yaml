id: go_goroutine_exit
domain: dev
kind: human
concern: code_rules
language: go
text: before writing `go`, name how the goroutine stops and who waits for it. it stops on `<-ctx.Done()`, on a closed input channel or on a done channel, and every `select` in it that can block includes one of them. its owner waits with `sync.WaitGroup` or, when the goroutines return errors, `errgroup.Group` from `golang.org/x/sync/errgroup`, whose `WithContext` cancels the rest on the first error and whose `SetLimit` bounds how many run. call `wg.Add(1)` before the `go` statement, never inside the goroutine, or use `wg.Go(f)` when the go.mod `go` line is 1.25 or later. a send on an unbuffered channel nobody will read blocks forever and leaks the goroutine. vet's `waitgroup` reports `Add` inside the goroutine, `go.uber.org/goleak` reports a leak in a test when the project uses it, and `go test -race` finds what the goroutines share.
notes: a goroutine with no defined exit leaks for the life of the process, and one nobody waits for races the code after it. it guards against blocked sends, missing cancellation and Add called inside the goroutine.
