id: go_shared_state
domain: dev
kind: human
concern: code_rules
language: go
text: a map, slice or field that two goroutines touch is guarded by one `sync.Mutex` or `sync.RWMutex`, or owned by one goroutine that the others reach through a channel. a concurrent read and write on a map is a fatal error that `recover` cannot catch, and it passes most test runs. keep the lock beside the data it guards and hold it for the shortest span: never across I/O, a channel send or a call that may take the same lock. a struct holding a `sync.Mutex`, `WaitGroup`, `Once` or `Cond` is never copied: its methods have pointer receivers and it is passed by pointer. use `atomic.Int64` and its siblings for a lone counter or flag. vet's `copylocks` reports a copied lock. only `go test -race` finds an unguarded map or field, and only on a path the tests reach.
notes: sources: cc-skills-golang golang-concurrency, its channel, mutex and atomic table; the common-go-bugs reference on concurrent map writes and copying sync types; go tool vet help copylocks.
