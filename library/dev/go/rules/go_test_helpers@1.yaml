id: go_test_helpers
domain: dev
kind: human
concern: code_rules
language: go
text: in a test, a helper that fails the test calls `t.Helper()` first, so the failure points at the caller's line. use `t.TempDir()` for files, `t.Setenv` for the environment and `t.Cleanup` for teardown, never a shared directory or a variable set and left behind. when the go.mod `go` line is 1.24 or later use `t.Context()` rather than `context.Background()`, and write a benchmark as `for b.Loop()` rather than a loop over `b.N`. `t.Fatal` and `t.FailNow` stop only the goroutine that calls them, so call them from the test's own goroutine and send failures back from any other. a list of cases is a table with a name per row, run through `t.Run`, and a failure message says what was got and what was wanted. golangci-lint's `thelper` checks the helper and `usetesting` the directory, environment and context, and vet's `testinggoroutine` reports a `Fatal` from another goroutine.
notes: tests that leak files, environment or failures between goroutines make each other flaky and point a failure at the wrong line. it guards against shared temporary state, Fatal called off the test's goroutine and failure messages that do not say what was wanted.
