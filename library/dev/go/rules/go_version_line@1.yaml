id: go_version_line
domain: dev
kind: human
concern: code_rules
language: go
text: write to the `go` line in go.mod, not to the Go on the machine. a standard library call added after that version builds for you and fails for anyone on the declared one: the `slices` and `maps` packages and `context.WithoutCancel` need 1.21, `os.OpenRoot` and `testing.B.Loop` 1.24, `sync.WaitGroup.Go` 1.25. loop variables are per iteration from 1.22, so `v := v` before a closure is needed below that line and noise from it on: keep it below and drop it only when the line says 1.22 or later. never raise the `go` line or the `toolchain` line to make a change compile; report that the change needs it. vet's `stdversion` reports a standard library symbol newer than the file's version, and golangci-lint's `copyloopvar` reports the copy that is no longer needed.
notes: code that uses something newer than the declared go version builds on the author's machine and breaks for everyone on the declared one. it guards against silent version bumps and code that leans on per-iteration loop variables below 1.22.
