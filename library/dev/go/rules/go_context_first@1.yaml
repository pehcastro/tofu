id: go_context_first
domain: dev
kind: human
concern: code_rules
language: go
text: a function that does I/O, waits or starts work takes `ctx context.Context` as its first parameter and passes that same `ctx` to everything it calls. never replace it with `context.Background()` or `context.TODO()` in the middle of a call chain: the work then outlives the caller's deadline and cancellation. a context is a parameter, never a struct field. every `context.WithCancel`, `WithTimeout` and `WithDeadline` is followed on the next line by `defer cancel()`, unless the cancel func is returned to the caller. use `http.NewRequestWithContext` and the `Context` variants of database calls. for work that must outlive a request, derive its context with `context.WithoutCancel(ctx)`, which needs Go 1.21. vet's `lostcancel` checks the cancel; golangci-lint's `contextcheck` reports a context that is not passed down, `noctx` a request or call made without one, and `containedctx` a context stored in a struct.
notes: a context that is dropped or replaced lets work outlive its caller's deadline and cancellation, leaking goroutines and requests. it guards against context.Background in the middle of a chain, contexts kept in structs and cancel funcs never called.
