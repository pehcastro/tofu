id: py_union_syntax
domain: dev
kind: human
concern: code_rules
language: python
text: when `requires-python` is 3.10 or later, write `X | None` and `int | str` in annotations, not `Optional[X]` or `Union[int, str]`, with `None` last. use the built-in generics, `list[str]` and `dict[str, int]`, not `typing.List` and `typing.Dict`, and take `Iterable`, `Mapping` and `Callable` from `collections.abc`. below 3.10, `X | None` in an annotation read at run time, as pydantic and FastAPI read them, raises `TypeError`, so keep the form the project already uses there. ruff reports `Union` as `UP007`, `Optional` as `UP045`, the `typing` aliases as `UP006` and their imports as `UP035`, taking the target version from `requires-python` when its own config sets none.
notes: sources: the typing best practices page, shorthand syntax and built-in generics; agents-knowledge python-type-safety; UP007, UP045, UP006 and UP035 confirmed with ruff rule on ruff 0.16.10, where Optional moved from UP007 to UP045; the target read from requires-python seen in ruff check --show-settings.
