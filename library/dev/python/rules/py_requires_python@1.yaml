id: py_requires_python
domain: dev
kind: human
concern: code_rules
language: python
text: write to `requires-python` in pyproject.toml, not to the Python on the machine. syntax and standard library calls newer than that version run for you and fail for anyone on the declared one: `match`, `zip(strict=True)` and `X | Y` in a runtime annotation need 3.10; `asyncio.TaskGroup`, `asyncio.timeout`, `except*`, `tomllib` and `typing.Self` 3.11; the `type` statement, `def f[T]()`, `itertools.batched` and `typing.override` 3.12. never raise `requires-python`, the ruff `target-version` or the type checker's Python version to make a change pass; report that the change needs it. ruff takes its target from `requires-python` when its own config sets none, and mypy or pyright set to the declared version report a standard library name that does not exist there.
notes: code that uses something newer than the declared Python runs for the author and fails for every user on the declared version. it guards against silent version bumps and new syntax slipping past the target.
