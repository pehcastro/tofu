id: py_safe_deserialize
domain: dev
kind: human
concern: code_rules
language: python
text: data from outside the process, a file a user gave, a request body, a message from a queue, is parsed as data and never as code. `yaml.load` with any loader but `SafeLoader`, `yaml.unsafe_load`, and `pickle` or `dill` on that data can run arbitrary code, and so can `eval` and `exec` on any string built from it. use `yaml.safe_load`, `json.loads`, `ast.literal_eval` for a Python literal, or a schema such as a pydantic model, then check the shape before using it: `safe_load` of a manifest can still return a list or a string where a dict was expected. ruff reports an unsafe `yaml.load` as `S506`, pickle as `S301`, `eval` as `S307` and `exec` as `S102`; bandit reports them as `B506`, `B301`, `B307` and `B102`.
notes: an unsafe loader or eval runs whatever code the data carries, so a crafted file or request takes over the process. it guards against yaml.load, pickle and eval on outside data, and against trusting the shape a safe loader returns.
