id: py_subprocess_args
domain: dev
kind: human
concern: code_rules
language: python
text: run a command as a list, `subprocess.run(["git", "log", ref], check=True)`, never as a string with `shell=True` and never through `os.system` or `os.popen`: a value from input inside a shell string is part of the command, and a file name holding `; rm -rf ~` runs it. the list form hands each element to the program as one argument with no shell between, so spaces and quotes need no escaping and `shlex.quote` is not needed. pass `check=True` or read `returncode`, and give a command that can hang a `timeout`. a value starting with `-` is still read as an option, so put `--` before positional input where the program accepts it. ruff reports `shell=True` as `S602` and `S604`, a shell started by `os.system` as `S605`, and a `subprocess.run` without `check` as `PLW1510`; bandit reports the first three as `B602`, `B604` and `B605`.
notes: sources: trail of bits sharp-edges lang-python, subprocess shell injection; the openai python security skills; S602, S604, S605 and PLW1510 confirmed with ruff rule on ruff 0.16.10; B602, B604 and B605 in bandit's plugin list.
