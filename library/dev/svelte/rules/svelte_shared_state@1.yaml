id: svelte_shared_state
domain: dev
kind: human
concern: code_rules
framework: svelte
text: state shared by a subtree lives in context, made with `createContext` and set by the component that owns it, never in a module-level `$state` or store: on the server one module instance serves every request, so a module variable written while rendering or in a `load` shows one person's data to the next. only what is the same for everyone, configuration or a constant, lives in a module. per-person state is kept in a cookie or the database and read in a server `load`. new shared reactive logic is a class with `$state` fields rather than a `writable` store. on the dev server, sign two people in, one in a private window, and read that neither page shows the other's data.
notes: module state on the server is shared by every request, so one person's data shows up on another person's page. it guards against data leaking between users through module-level state and stores.
