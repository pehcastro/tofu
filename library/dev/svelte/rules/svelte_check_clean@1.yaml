id: svelte_check_clean
domain: dev
kind: human
concern: code_rules
framework: svelte
text: the gate runs `svelte-check --fail-on-warnings`, so a compiler warning fails it as a type error does, accessibility warnings included. fix the code a warning names; never silence it with `<!-- svelte-ignore code -->` or `--compiler-warnings "code:ignore"` unless the warning is wrong for that one line, and then the ignore names that one code. runtime warnings do not reach svelte-check: a development build prints `ownership_invalid_mutation`, `state_proxy_equality_mismatch` and the rest through `console.warn`, so a Playwright test fails on any console warning during the flow.
notes: sources: sveltejs ai-tools svelte-code-writer, on validating every component; the svelte-check 4.2 readme on --fail-on-warnings and --compiler-warnings; the client warnings as svelte 5.45 ships them.
