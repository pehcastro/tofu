id: svelte_runes_only
domain: dev
kind: human
concern: code_rules
framework: svelte
text: in a Svelte 5 project, write runes and never Svelte 4 syntax: `let { title } = $props()` for `export let`, `$derived` or `$effect` for `$:`, a `...rest` from `$props()` for `$$props` and `$$restProps`, `onclick={handler}` for `on:click`, a callback prop for `createEventDispatcher`, `{#snippet}` and `{@render}` for `<slot>`, a capitalised variable for `<svelte:component this={...}>`, a self-import for `<svelte:self>`, `{@attach}` for `use:action`, and `page` from `$app/state` for `$app/stores`. one rune puts the whole component in runes mode, where every legacy form in it stops compiling, so a Svelte 4 component you edit is converted whole, not in part. the compiler refuses the legacy forms in runes mode as `legacy_export_invalid`, `legacy_reactive_statement_invalid`, `legacy_props_invalid` and `legacy_rest_props_invalid`, and warns `event_directive_deprecated`, `slot_element_deprecated`, `svelte_component_deprecated` and `svelte_self_deprecated`.
notes: Svelte 4 syntax in a runes component stops it compiling, and a half-converted component confuses every reader. it guards against legacy forms in Svelte 5 code.
