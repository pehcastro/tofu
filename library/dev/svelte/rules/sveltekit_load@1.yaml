id: sveltekit_load
domain: dev
kind: human
concern: code_rules
framework: svelte
text: a page's data comes from its `load`: `+page.server.js` or `+layout.server.js` for anything private, a database, a secret, `cookies` or `locals`, and `+page.js` only for public data both sides may fetch. a `load` uses the `fetch` it is given, returns plain serialisable data, and changes nothing outside itself. the page reads it as `let { data }: PageProps = $props()`, typed from `./$types`. set a cookie with `cookies.set`, never `setHeaders`. a layout's server `load` does not re-run on every client navigation, so an auth check there does not guard its children: check in the `handle` hook or in each page's server `load`. call `error(404, ...)` and `redirect(303, ...)` from `@sveltejs/kit` rather than returning a flag. a private env module imported into browser code fails the build with `Cannot import ... into code that runs in the browser`, unserialisable data fails with `is not serializable`, a cookie passed to `setHeaders` fails with an error naming `event.cookies.set`, and `svelte-check` reports a wrong `PageProps` or `PageServerLoad`.
notes: sources: the Svelte llms-small docs, SvelteKit loading data, universal and server loads, headers and cookies, errors and redirects, implications for authentication and server-only modules; the messages as @sveltejs/kit 2.49 ships them in its vite plugin, its server respond and its serialisation check.
