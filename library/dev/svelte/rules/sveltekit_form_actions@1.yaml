id: sveltekit_form_actions
domain: dev
kind: human
concern: code_rules
framework: svelte
text: a mutation a form makes is a form action: `export const actions` in `+page.server.js`, the only file that may export it, and a `<form method="POST">` that works before JavaScript loads, enhanced with `use:enhance` from `$app/forms`. once there is more than one action, name each and post to `action="?/create"`, with no `default` beside them. validate `await request.formData()` on the server and return `fail(400, { email, missing: true })` for a bad field, so the page re-renders with `form` and keeps what was typed; never throw for it, which shows the error page. call `redirect(303, ...)` after a success that moves on. a hand-written submit handler reads the response with `deserialize` and `applyAction`, never `JSON.parse`. SvelteKit refuses `Invalid export 'actions'` outside `+page.server.js`, `When using named actions, the default action cannot be used`, and `Cannot prerender pages with actions`. on the dev server, submit the form with JavaScript turned off, then submit an invalid value and read that the message sits by its field and the value is kept.
notes: a form that needs JavaScript fails for anyone whose script has not loaded, and a thrown validation error replaces the page and loses what was typed. it guards against fragile forms and errors that erase input.
