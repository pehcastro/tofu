id: rust_bounded_recursion
domain: dev
kind: human
concern: code_rules
language: rust
text: a function whose recursion depth comes from input, nested data, a chain of references, a tree read from a file or a request, overflows the stack on deep enough input, and a stack overflow aborts the whole process rather than panicking. write it as a loop over an explicit stack, `let mut pending = vec![root]; while let Some(node) = pending.pop() { ... }`, keeping a visited set when the input can point back at itself, or carry a depth and return an error past a stated limit. a recursive type such as `Box<Node>` also recurses when it is dropped, so a deep one needs a `Drop` that moves its children into a `Vec` and drains it. never raise the thread's stack size as the fix. serde_json already stops at depth 128 with `recursion limit exceeded`, so never call `disable_recursion_limit` on input you do not control. no clippy lint finds this, and clippy's `unconditional_recursion` covers only recursion that can never stop: the check is a test that builds input 100,000 levels deep and asserts a result or an error, not a crash.
notes: recursion driven by input overflows the stack on deep input, and a stack overflow aborts the process rather than returning an error. it guards against crashes on nested or self-referencing data, Drop included.
