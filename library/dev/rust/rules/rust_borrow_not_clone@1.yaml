id: rust_borrow_not_clone
domain: dev
kind: human
concern: code_rules
language: rust
text: on a borrow error, E0382 use of a moved value, E0499 two mutable borrows, E0502 a mutable borrow beside a shared one, E0597 a value dropped while still borrowed, run `rustc --explain <code>` and ask who should own the value and for how long before you change anything. the fix is usually a shape: end the shared borrow before the mutable one, borrow instead of moving, give the value to the owner that outlives its users, or split a struct so two fields are borrowed apart. `.clone()`, `Rc<RefCell<_>>`, `Arc` and a `'static` bound come last, taken when the data really is shared, never to make the error go away, and never `unsafe`. clippy's `redundant_clone` finds a clone whose original is never used again.
notes: sources: rust-skills m01-ownership, its table turning each borrow error into a question about ownership; Apollo's Rust handbook, chapter 1, borrowing over cloning; ECC rust-build-resolver, which forbids unsafe to get past the borrow checker.
