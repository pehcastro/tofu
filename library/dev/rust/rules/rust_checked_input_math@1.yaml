id: rust_checked_input_math
domain: dev
kind: human
concern: code_rules
language: rust
text: arithmetic, casts and indexing on a value derived from input are checked. `a + b` overflows: it panics in a debug build and wraps silently in release unless the profile sets `overflow-checks`, so use `checked_add` and its siblings and return an error on `None`, or `saturating_add` where clamping is the meaning. division by an input that can be zero panics in every build, `wrapping_div` included; only `checked_div` does not. a narrowing `as`, such as `len as u32`, truncates without a word: write `u32::try_from(len)?`. `v[i]` panics out of range: use `v.get(i)`. `&s[a..b]` on a `str` panics when a byte index falls inside a character: use `s.get(a..b)` or take the index from `char_indices`. clippy's restriction lints `arithmetic_side_effects`, `indexing_slicing` and `string_slice` and the pedantic `cast_possible_truncation` check this.
notes: arithmetic, casts and indexing on input panic in debug and corrupt values silently in release. it guards against overflow, truncation, out of range indexes and string slices that split a character.
