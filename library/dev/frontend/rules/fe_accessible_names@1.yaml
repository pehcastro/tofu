id: fe_accessible_names
domain: dev
kind: human
concern: code_rules
framework: react, svelte, vue, solid, angular, astro, preact
text: every control has an accessible name: an icon-only button carries `aria-label` and its icon `aria-hidden="true"`, and a link's text says where it goes, never click here. an image that informs has alt text giving its meaning; a decorative one has `alt=""`. a heading and a link are never empty. the checks are axe's `button-name`, `link-name`, `image-alt` and `svg-img-alt`, jsx-a11y's `alt-text`, `anchor-has-content`, `heading-has-content` and `control-has-associated-label`, the Svelte compiler's `a11y_missing_attribute`, `a11y_missing_content` and `a11y_consider_explicit_label`, and eslint-plugin-vuejs-accessibility's `alt-text`, `anchor-has-content` and `heading-has-content`.
notes: a control without an accessible name is invisible to a screen reader and to voice control, so the person cannot find it or tell what it does. it guards against icon-only buttons, click here links and images whose meaning lives only in their pixels.
