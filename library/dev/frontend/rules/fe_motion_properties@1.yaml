id: fe_motion_properties
domain: dev
kind: human
concern: code_rules
framework: react, svelte, vue, solid, angular, astro, preact
text: animate `transform` and `opacity`, never `width`, `height`, `top`, `left`, `margin` or `padding`, which redo layout on every frame. name the properties a transition covers: `transition: all` and Tailwind's `transition-all` animate whatever changes next, layout included. never start from `scale(0)`: start at 0.95 or above and let opacity carry the rest. an anchored popover or menu scales out of its trigger, `transform-origin: var(--transform-origin)` with Base UI or `var(--radix-popover-content-transform-origin)` with Radix, and a modal scales from its centre. stylelint's `declaration-property-value-disallowed-list` refuses `/\ball\b/` and `/\b(width|height|top|left|margin|padding)\b/` in `transition` and `transition-property`.
notes: animating layout properties redoes layout on every frame and stutters, and transition all animates changes nobody meant to animate. it guards against janky size and position animation and popovers that grow out of the wrong point.
