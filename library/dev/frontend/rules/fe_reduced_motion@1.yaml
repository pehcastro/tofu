id: fe_reduced_motion
domain: dev
kind: human
concern: code_rules
framework: react, svelte, vue, solid, angular, astro, preact
touches: (?i)animat|motion|transition|keyframe|parallax|spring|slide|carousel|autoplay|reduced
text: under `prefers-reduced-motion: reduce`, remove movement and keep feedback: a slide, a scale, parallax or a spring becomes an instant change or a short opacity fade, and a colour or opacity change that says something happened stays. in script, read `matchMedia("(prefers-reduced-motion: reduce)")` and set the distance to zero rather than deleting the animation. motion that plays by itself for more than five seconds beside other content has a pause control. the project's own tests stub `matchMedia` to report `reduce`, open each animated surface, and assert nothing animates `transform`; the DevTools Rendering panel turns the preference on in the real browser on the dev server.
notes: movement on screen can cause nausea and dizziness for people with vestibular disorders, who ask the system to reduce it. it guards against ignoring that preference, and against removing the feedback along with the movement.
