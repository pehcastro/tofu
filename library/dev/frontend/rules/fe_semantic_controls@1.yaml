id: fe_semantic_controls
domain: dev
kind: human
concern: code_rules
framework: react, svelte, vue, solid, angular, astro, preact
text: use the native element before ARIA: `<button>` for an action, `<a href>` or the router's link for navigation, `<input>`, `<select>`, `<dialog>`, `<details>`. a `div` or `span` with a click handler is not a button: it takes no focus, ignores Enter and Space, and has no role. add `role` only where nothing native fits, and then every attribute the role requires. never put one interactive element inside another. the checks are axe's `nested-interactive` and `aria-required-attr`, jsx-a11y's `no-static-element-interactions`, `click-events-have-key-events`, `interactive-supports-focus` and `prefer-tag-over-role`, the Svelte compiler's `a11y_no_static_element_interactions`, `a11y_click_events_have_key_events` and `a11y_interactive_supports_focus`, and eslint-plugin-vuejs-accessibility's `no-static-element-interactions`, `click-events-have-key-events` and `interactive-supports-focus`.
notes: sources: nkz-taste craft.md C32 and web-design.md on components and primitives; ibelick fixing-accessibility, keyboard access and semantics; the Vercel web interface guidelines, state and navigation and content and accessibility.
