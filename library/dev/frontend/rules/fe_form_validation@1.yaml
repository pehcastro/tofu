id: fe_form_validation
domain: dev
kind: human
concern: code_rules
shapes: design
framework: react, svelte, vue, solid, angular, astro, preact
text: check a field when it loses focus and clear its error as soon as the value is valid; never mark a field the person has not touched, which `:user-invalid` already respects in CSS. show the error beside its field, tie it with `aria-describedby`, set `aria-invalid`, and on submit move focus to the first invalid field. keep submit enabled until the request starts, or say next to it what is missing; a disabled button with no reason is a dead end. a failed submit and Back keep what was typed, and leaving a form with unsaved changes asks first. the project's own tests submit the empty form and assert focus and the error message on the first field, and tofu's browser tools do the same on the dev server and read the result.
notes: an error shown too early nags, an error shown away from its field is missed, and a lost form is work the person must redo. it guards against marking untouched fields, a disabled submit with no reason, and typed input lost on a failed submit or Back.
