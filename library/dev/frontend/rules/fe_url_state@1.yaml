framework: react, svelte, vue, solid, angular, astro, preact
text: a discrete choice, a category, a tab, a sort, a page or an expanded panel, pushes a history entry with `history.pushState` or the router's navigate, never `replaceState`, so Back returns the view before it. typing in a search replaces the current entry instead, so Back does not step through every key. both live in the URL, so a reload and a shared link open the same view, and Back restores the scroll position. changing them keeps focus where it was and does not replay an entrance or reopen a dialog. a Playwright test sets a filter, calls `page.reload()`, and asserts the filter and its results held; another picks two categories in turn, calls `page.goBack()`, and asserts the first is selected again.
notes: sources: nkz-taste craft.md C60 and the recess recipe on query changes that keep focus; the Vercel web interface guidelines, state and navigation.
