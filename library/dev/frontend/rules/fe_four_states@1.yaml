id: fe_four_states
domain: dev
kind: human
concern: code_rules
framework: react, svelte, vue, solid, angular, astro, preact
text: every view that loads data has an empty, a loading, an error and a success state, each built and each reachable. empty says what belongs here and the next step; filtered to nothing names the filters and offers to clear them; an error says what failed, why, and how to recover, where it failed: a field error at the field, a page error on the page, never a toast for a field. announce an async result in a polite live region such as `role="status"`, because a screen reader never sees a toast. the project's own tests answer the request with an empty list, then a 500, then a delay, and assert the text of each state, and tofu's browser tools read each state a person can reach on the dev server.
notes: a view built only for the happy path shows a blank screen, an endless spinner or a raw error when the data is empty, slow or failing. it guards against states nobody built and results a screen reader never hears.
