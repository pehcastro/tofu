id: fe_no_native_widgets
domain: dev
kind: human
concern: code_rules
framework: react, svelte, vue, solid, angular, astro, preact
text: when the project has a component library, a primitives package, Tailwind or its own CSS system, never ship the browser's own UI for something the product draws: no `alert`, `confirm` or `prompt`, no `<input type="date">`, `time`, `datetime-local`, `month`, `week` or `color` with its native picker, and no `title` attribute as a tooltip. when the project also ships its own select, listbox or combobox, a native `<select>` is that component instead, since the browser draws the open list in its own style; with no such component, `<select>` stays the native element to reach for first. use the project's component, or build one from its primitives, and keep what the native one gave for free: a real label, the keyboard, focus that returns where it was. the checks are eslint's core `no-alert`, which runs on the script of a `.vue` or `.svelte` file through that file's parser, a search for `type="(date|time|datetime-local|month|week|color)"` across the source, a search for `<select` where the project has its own select, and a search for `title=` on a button, a link or an input.
notes: the browser's own dialogs and pickers look foreign inside a designed product, differ between browsers and cannot be styled. it guards against alert, confirm, native date and colour pickers and title tooltips in a project that already draws its own components.
