id: fe_layout_shift
domain: dev
kind: human
concern: code_rules
framework: react, svelte, vue, solid, angular, astro, preact
text: reserve the space content will take before it arrives: `width` and `height`, or an `aspect-ratio`, on every `img`, `video` and `iframe`; a skeleton the size and shape of what it stands for; a minimum height for text that loads late. keep the page frame mounted through a refresh and show the previous data until the new data lands, rather than blanking it for a skeleton, and never run a skeleton and a content entrance animation for the same load. the number is CLS at or under 0.1 at the 75th percentile, read with `onCLS` from the web-vitals library, and a search of the markup finds no `img` without a width and a height.
notes: content that moves as other content arrives makes people lose their place and press the wrong thing. it guards against unsized media, skeletons unlike what they stand for and a frame torn down on every refresh.
