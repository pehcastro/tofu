id: fe_motion_interruptible
domain: dev
kind: human
concern: code_rules
framework: react, svelte, vue, solid, angular, astro, preact
text: motion a person can trigger again before it ends, a panel toggled twice, toasts added in a burst, a drag, uses a CSS transition or a spring, which turn around from where they are. a `@keyframes` animation restarts from zero, so keep keyframes for motion that runs once or loops, such as a shimmer. animate between two measured values, never to or from `auto`. for an entry with no script, write the start state in `@starting-style`. a drag commits on velocity rather than distance alone, calls `setPointerCapture` when it starts, ignores a second pointer, and slows past its bounds rather than stopping dead. a Playwright test triggers the motion twice inside its duration and asserts `getComputedStyle(el).transform` between the two never jumps back to the start value.
notes: sources: nkz-taste animations.md, sections 4 and 8 on springs, transitions over keyframes, @starting-style and gestures; the Vercel web interface guidelines, animation, on interruptible motion.
