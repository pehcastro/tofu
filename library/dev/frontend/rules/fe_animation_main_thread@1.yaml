id: fe_animation_main_thread
domain: dev
kind: human
concern: code_rules
framework: react, svelte, vue, solid, angular, astro, preact
touches: (?i)animat|motion|scroll|parallax|requestanimationframe|will-change|blur|transition|keyframe
text: never drive animation from a `scroll` listener or from a `requestAnimationFrame` loop with no stop: use `animation-timeline: scroll()` or `view()`, or an `IntersectionObserver` to start and pause it. read layout, `getBoundingClientRect` and `offsetHeight`, for every element before writing any style, never alternating the two in a loop. add `will-change` just before an animation and remove it after, never in a stylesheet. set `transform` on the moving element rather than a CSS variable on its container, which every child inherits and recalculates. animate `filter: blur()` only briefly and on a small element. stylelint's `property-disallowed-list` refuses `will-change` in stylesheets, and tofu's browser tools recording the motion on the dev server show no frame over 50 ms, and the DevTools Performance panel at a 4x CPU slowdown shows the same.
notes: animation driven by script or by layout reads competes with input for the main thread, so the page stutters exactly while it moves. it guards against scroll listeners, interleaved layout reads and writes, and permanent layers that cost memory and frames on slower machines.
