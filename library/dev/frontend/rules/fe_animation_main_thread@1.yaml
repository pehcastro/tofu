id: fe_animation_main_thread
domain: dev
kind: human
concern: code_rules
framework: react, svelte, vue, solid, angular, astro, preact
text: never drive animation from a `scroll` listener or from a `requestAnimationFrame` loop with no stop: use `animation-timeline: scroll()` or `view()`, or an `IntersectionObserver` to start and pause it. read layout, `getBoundingClientRect` and `offsetHeight`, for every element before writing any style, never alternating the two in a loop. add `will-change` just before an animation and remove it after, never in a stylesheet. set `transform` on the moving element rather than a CSS variable on its container, which every child inherits and recalculates. animate `filter: blur()` only briefly and on a small element. stylelint's `property-disallowed-list` refuses `will-change` in stylesheets, and a trace under a 4x CPU slowdown, CDP `Emulation.setCPUThrottlingRate` with `rate: 4` through a Playwright `newCDPSession`, shows no frame over 50 ms during the motion.
notes: sources: nkz-taste animations.md section 9 on performance; ibelick fixing-motion-performance, its never patterns, measurement, scroll, paint and layers; the Vercel web interface guidelines, performance, on batching layout reads and writes.
