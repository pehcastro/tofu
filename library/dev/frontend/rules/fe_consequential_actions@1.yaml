id: fe_consequential_actions
domain: dev
kind: human
concern: code_rules
framework: react, svelte, vue, solid, angular, astro, preact
text: a reversible destructive action happens at once and offers undo; an irreversible one asks first, and the question states the consequence, such as this deletes 12 runs and cannot be undone, never a bare are you sure. update the screen before the server answers only for a low-risk action, a toggle, a like, a reorder, and on failure roll it back and say so; a payment, a deletion or a send shows real progress and the real result. after a mutation, change the data and the actions on screen; a toast alone is not done. a Playwright test fails the request with `page.route` and asserts the rollback and its message.
notes: sources: nkz-taste craft.md C7, C8 and C48, interactions.md rules 16 and 17, and web-design.md on feedback after a mutation; the Vercel web interface guidelines, feedback.
