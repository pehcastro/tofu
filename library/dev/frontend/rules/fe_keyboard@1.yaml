id: fe_keyboard
domain: dev
kind: human
concern: code_rules
framework: react, svelte, vue, solid, angular, astro, preact
text: everything a pointer does, the keyboard does. Tab moves between widgets and the arrow keys move inside a composite one, a tab list, a menu, a listbox, a grid, a radio group, as its WAI-ARIA Authoring Practices pattern describes, with one tab stop per widget through a roving `tabindex` or `aria-activedescendant`. a drag, a swipe or a hover reveal has a button or a menu item that does the same, and nothing appears on hover alone. the checks are axe's `scrollable-region-focusable`, jsx-a11y's `aria-activedescendant-has-tabindex` and `mouse-events-have-key-events`, the Svelte compiler's `a11y_aria_activedescendant_has_tabindex` and `a11y_mouse_events_have_key_events`, eslint-plugin-vuejs-accessibility's `mouse-events-have-key-events`, and the flow completed on the dev server with tofu's browser tools pressing keys alone.
notes: people who cannot use a pointer depend on every action being reachable by keyboard, in the way the platform's own widgets behave. it guards against drag-only and hover-only features and widgets that trap or ignore the arrow keys.
