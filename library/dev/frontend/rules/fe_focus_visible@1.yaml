id: fe_focus_visible
domain: dev
kind: human
concern: code_rules
framework: react, svelte, vue, solid, angular, astro, preact
text: never remove the focus outline, `outline: none` or Tailwind's `outline-none` and `outline-hidden`, without a `:focus-visible` ring at least 2 px thick and 3:1 against what surrounds it. the ring appears at once and is never animated. a sticky header or footer never covers the focused element: set `scroll-padding-top` and `scroll-padding-bottom` to their heights. a container of focusable children does not clip their rings with `overflow: hidden`. focus order is DOM order: fix the markup, never a positive `tabindex`. the checks are axe's `tabindex`, jsx-a11y's `tabindex-no-positive`, the Svelte compiler's `a11y_positive_tabindex`, eslint-plugin-vuejs-accessibility's `tabindex-no-positive`, and tofu's browser tools pressing Tab through the page on the dev server and reading each focused element.
notes: keyboard users steer by the focus ring, and a page that hides it, clips it or scrolls the focused element under a sticky bar leaves them lost. it guards against an outline removed with nothing in its place and a tab order that jumps around.
