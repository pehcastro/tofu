id: fe_dialog
domain: dev
kind: human
concern: code_rules
framework: react, svelte, vue, solid, angular, astro, preact
text: build a dialog from the project's accessible primitive or a native `<dialog>` opened with `showModal()`, never from a positioned `div`. it is named by its title and has a visible close control; opening it moves focus inside, Tab and Shift+Tab stay inside, Escape closes it, and closing returns focus to the control that opened it. opening it never shifts the page behind: keep the scrollbar's space with `scrollbar-gutter: stable`, and give its scrolling body `overscroll-behavior: contain`. the checks are axe's `aria-dialog-name`, the project's own tests opening it from the keyboard, pressing Escape and asserting focus is back on the trigger, and the same steps through tofu's browser tools on the dev server, reading where focus landed.
notes: a dialog built by hand usually lets focus escape behind it, ignores Escape and drops focus on close, which strands keyboard and screen reader users. it guards against positioned divs posing as dialogs and against the page shifting when one opens.
