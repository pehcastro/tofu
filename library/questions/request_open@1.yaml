name: request_open
domain: general
questions_version: 1
mode: enforced
notes: >-
  asked by internal/turn/inbox.go once for each message the person types to
  the lead, before the lead's turn starts. state.said is that message alone,
  without tofu's notes. at or above open_at the verdict is ask: the task
  carries a note that the request is open, and the rule restate_open makes
  the first reply restate it in tofu's words with what is in and out, then
  wait. below it the verdict is allow and the lead proceeds. an error or a
  timeout gives ask too, since restating costs one reply and never goes
  wrong; with no Jev configured the question is not asked and no note is
  given. open_at is the middle of the noul range, an uncalibrated prior.

thresholds:
  open_at: 0.5

state:
  - said

questions:
  open:
    type: noul
    instructions: >-
      A person typed said to a coding agent. Decide whether said asks for
      work and leaves open what that work is, so that two careful engineers
      reading it could start on different changes and both believe they did
      what was asked. A message that only approves, agrees, answers or asks
      something brings no new work of its own, so it is never open, however
      little it names.
    criteria:
      true: >-
        said asks for an outcome, a quality or a direction and leaves to the
        agent which change makes it true, where it is made, or how much of
        it is enough, or describes a feature by how it should seem to a
        person rather than by what it does.
      false: >-
        said names the change closely enough that the work is the same
        whoever does it: the thing to change, where it is, and what it
        becomes, or a command to run; or said asks for no work at all, such
        as a question, an answer, an approval, news or a greeting.
