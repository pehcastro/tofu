name: rule_applies
domain: general
questions_version: 1
mode: enforced
notes: >-
  asked by internal/agent/loop/compose.go when a prompt is composed for a writer,
  a sub-agent or a lead working alone. state.task is the task text,
  state.paths the paths it names or owns, empty when it names none, and
  state.rules holds each rule whose touches would otherwise decide, with its
  id and text; every other part of its trigger, the framework a path reaches
  included, already reaches the task. compose asks applies once for each rule in one
  request, naming it rules[i]. a rule fires when its applies answer is at or
  above applies_at and is held below it. on an error, a timeout or with no
  classifier bound the touches keyword decides, and the prompt says which of
  the two decided. applies_at is an uncalibrated prior.

thresholds:
  applies_at: 0.5

state:
  - task
  - paths
  - rules

questions:
  applies:
    type: noul
    instructions: >-
      A person gave a coding agent the request in task, working on the files
      in paths, or on files it has to find when paths is empty. Decide
      whether the rule governs any part of that work: the code it writes,
      how that code must behave, perform or respect a person's settings, or
      how the result is checked, judged by what the work involves rather
      than by the words task happens to use.
    criteria:
      true: >-
        some part of the work in task, its code, its behaviour, its cost or
        its check, is what the rule governs, so an agent that never read the
        rule would likely break it.
      false: >-
        no part of the work in task reaches what the rule governs, even where
        the two share a word.
