name: request_open
domain: general
questions_version: 2
mode: enforced
notes: >-
  asked by internal/agent/loop/inbox.go for each message the person types or
  steers to the lead, before the lead acts on it. state.said is that message
  without tofu's notes, state.replied is the end of the lead's last reply
  before it, and state.task is the task the lead held before it; both are an
  empty string when there is none, never missing, since a missing field is
  answered anyway. at or above open_at the verdict is ask: the task carries a
  note that the request is open, and the rule restate_open makes the first
  reply restate it with what is in and out, then wait. below it the verdict
  is allow and the lead proceeds. an error or a timeout gives allow and no
  note, and the row's mode_reason says why, since the person re-reading a
  playback costs more than one wrong start; with no Jev configured the
  question is not asked. version 1 read said alone and restated continuations
  such as a go on a listed set of tickets. open_at is the middle of the noul
  range, an uncalibrated prior.

thresholds:
  open_at: 0.5

state:
  - said
  - replied
  - task

questions:
  open:
    type: noul
    instructions: >-
      A person typed said to a coding agent. replied is the end of the
      agent's last reply before said and task is the work the agent held
      before said; either may be empty. Decide whether the agent, reading
      said in the light of replied and task, would have to guess what the
      person wants before it could start, so that two careful engineers
      could start on different changes and both believe they did what was
      asked. Words that carry on, accept, choose from or answer what
      replied laid out, or that go on with task, bring nothing new to
      guess however little they name, so they are never open.
    criteria:
      true: >-
        said brings new work that replied and task do not already settle,
        such as a feature told by how it should feel or behave, an intent or
        direction, a quality to reach, a request of many linked steps or a
        long run whose shape nobody agreed, and leaves to the agent which
        change makes it true, where it is made, or how much is enough.
      false: >-
        the work is fixed already: said names the change closely enough
        that anyone would make the same one, or said accepts, chooses from,
        corrects or carries on what replied laid out or what task holds; or
        said asks for no work at all, such as a question, news or a
        greeting.
