name: task_kind
domain: general
questions_version: 1
mode: enforced
notes: >-
  asked by internal/turn/compose.go each time a prompt is composed for a task
  that is not blank, the lead's and each spawn's brief, when the run gives
  Compose a kind judge. state.task is the task text alone. a rule declaring
  task: debug, explore, review, write or plan fires when the chosen kind is
  that one. when the chosen option's probability is at or above kind_at the
  verdict is allow and the kind is Jev's; below it, on an error, a timeout or
  with no classifier bound, the verdict is ask and the word list in
  verbNamed decides, and the prompt says which of the two named the kind.
  kind_at is an uncalibrated prior.

thresholds:
  kind_at: 0.5

state:
  - task

questions:
  kind:
    type: choice
    instructions: >-
      A person gave a coding agent the request in task. Choose the one kind
      of work the request asks for, by what the agent must do rather than by
      the words it happens to use: a word like debug, review or plan can name
      a thing to build rather than the work.
    escape: none
    options:
      - name: debug
        criteria: >-
          Something behaves wrongly now: a crash, a failure, a hang, a wrong
          value, a red build or a question about why a fault happens, and the
          agent must find the cause and fix it.
      - name: review
        criteria: >-
          A change already exists, such as a diff, a commit, a branch, staged
          edits or a pull request, and the agent must examine it and report
          what is wrong with it or whether it is safe, not write it.
      - name: explore
        criteria: >-
          The agent must read existing code and explain how something works,
          where it lives or what touches it, with no fault reported and no
          change asked for.
      - name: write
        criteria: >-
          The agent must add, change, move, rename, split or remove code or
          text that nobody reports as broken.
      - name: plan
        criteria: >-
          The agent must decide or write down work for later, such as a plan,
          a design, tickets or an epic, without doing that work now.
      - name: none
        criteria: >-
          No work is asked for: thanks, an approval, an answer, a greeting, or
          a request that fits none of the other kinds.
