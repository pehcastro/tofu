name: thrift
domain: result
questions_version: 1

state:
  - task
  - tool
  - command
  - paragraph
  - position

questions:
  still_needed:
    type: noul
    instructions: >-
      A tool was run to make progress on the task, and its result is about to
      be put in front of the model that asked for it. The result has been cut
      into paragraphs and this is one of them. Decide whether the model still
      needs this paragraph in front of it to carry out the task it stated.
      Judge the paragraph against that task, not against how interesting it
      looks: the same paragraph can be the whole answer to one request and
      noise in another. Assume the model has already been told the tool and
      the command that ran, so a paragraph that only repeats those adds
      nothing.
    criteria:
      true: >-
        The model would be worse off without this paragraph. It carries a
        fact the task asks for, or names the file, symbol, count, path or
        value the task is about, or it reports something that went wrong, or
        it is the part of the result the next step has to act on.
      false: >-
        The model can carry out the task just as well without this paragraph.
        It is filler for this particular task: repetition of what a
        neighbouring paragraph already says, entries the task does not ask
        about, decoration, or a long uniform run where a few lines already
        make the point.
