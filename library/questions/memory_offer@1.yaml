name: memory_offer
domain: general
questions_version: 1

state:
  - message

questions:
  standing:
    type: noul
    instructions: >-
      `message` is one message a person typed to a coding agent. Judge whether
      it states something that should still hold after the current task is
      over: a lasting instruction, a preference about how the agent should
      work, or a fact or decision about the project that the agent would
      otherwise forget.
    criteria:
      true: >-
        It says how things should always or never be done, what the person
        wants from the agent in general, or a lasting fact or decision about
        the project.
      false: >-
        It is about this task only: a request, a question, an answer, a status
        check, an approval, or feedback on one piece of work.

  corrects:
    type: noul
    instructions: >-
      Judge whether `message` corrects how the agent behaved: it complains
      that the agent did the wrong thing, did not do what was asked, stopped
      when it should not have, or made the person do something the agent
      could have done.
    criteria:
      true: >-
        The person is correcting or complaining about the agent's behaviour.
      false: >-
        The person is not correcting the agent's behaviour.

  about:
    type: choice
    instructions: >-
      Choose what `message` is mainly about.
    escape: task
    options:
      - name: person
        criteria: >-
          How the person works and what they want from the agent in every
          project: how to report, when to act, when to ask, what to run.
      - name: project
        criteria: >-
          A fact, a decision or a convention of this project that holds beyond
          the current task.
      - name: task
        criteria: >-
          Only the work in front of the agent right now.
