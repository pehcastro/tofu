[package]
name = "desk_plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
flume = { version = "0.11.1", default-features = false }
wasmtime = { version = "=48.0.5", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }
serde = { version = "1.0.221", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
wasmparser = "=0.254.2"
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }

[dev-dependencies]
wit-component = { version = "=0.254.2", default-features = false }
wasm-encoder = "=0.254.2"

[[example]]
name = "scan"
test = true
harness = false

[[example]]
name = "notes"
harness = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
