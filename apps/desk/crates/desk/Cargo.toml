[package]
name = "desk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
desk_canvas = { workspace = true, optional = true }
desk_control = { path = "../control" }
desk_core.workspace = true
desk_motion.workspace = true
desk_perf = { path = "../perf", default-features = false }
desk_plugin.workspace = true
desk_ui.workspace = true
desk_terminal.workspace = true
desk_tiling.workspace = true
draw_doc = { workspace = true, optional = true }
flume = { version = "0.11.1", default-features = false, features = ["async"] }
gpui.workspace = true
gpui_platform.workspace = true
serde.workspace = true
serde_json = "1.0.149"
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }

[features]
default = ["screen-work", "module-subagents", "module-file-edits", "module-shells", "screen-limits", "screen-classifier", "screen-library", "screen-context", "screen-session", "screen-forks", "screen-usage", "screen-boardy"]
screen-work = []
screen-boardy = ["screen-work"]
screen-settings = []
screen-accounts = []
screen-theme = []
screen-library = []
screen-classifier = []
screen-usage = []
screen-limits = []
screen-context = []
screen-session = []
screen-forks = []
module-subagents = []
module-file-edits = []
module-shells = []
module-editor = []
module-browser = []
module-data-studio = []
screen-platforms = []
screen-intro = []
screen-onboarding = ["screen-intro"]
plugin-notepad = ["screen-work"]
plugin-draw = ["screen-work", "dep:desk_canvas", "dep:draw_doc"]
all-screens = ["plugin-notepad", "plugin-draw", "screen-work", "screen-boardy", "screen-settings", "screen-accounts", "screen-theme", "screen-library", "screen-classifier", "screen-usage", "screen-limits", "screen-context", "screen-session", "screen-forks", "module-subagents", "module-file-edits", "module-shells", "module-editor", "module-browser", "module-data-studio", "screen-platforms", "screen-intro", "screen-onboarding"]

[lints]
workspace = true
