[workspace]
resolver = "3"
members = ["crates/core", "crates/ui", "crates/terminal", "crates/perf", "crates/desk", "crates/motion", "crates/plugin", "crates/book", "crates/tiling", "crates/markdown"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
desk_core = { path = "crates/core" }
desk_ui = { path = "crates/ui" }
desk_terminal = { path = "crates/terminal" }
desk_perf = { path = "crates/perf" }
desk_motion = { path = "crates/motion" }
desk_plugin = { path = "crates/plugin" }
desk_tiling = { path = "crates/tiling" }
gpui = { package = "gpui-ce", path = "vendor/gpui-ce/crates/gpui" }
gpui_platform = { package = "gpui_ce_platform", path = "vendor/gpui-ce/crates/gpui_platform" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
debug-assertions = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true

[profile.motion]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = false
