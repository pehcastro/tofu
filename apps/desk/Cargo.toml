[workspace]
resolver = "3"
members = ["crates/core", "crates/ui", "crates/terminal", "crates/desk"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
desk_core = { path = "crates/core" }
desk_ui = { path = "crates/ui" }
desk_terminal = { path = "crates/terminal" }
gpui = { package = "gpui-ce", path = "vendor/gpui-ce/crates/gpui" }
gpui_platform = { package = "gpui_ce_platform", path = "vendor/gpui-ce/crates/gpui_platform" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
