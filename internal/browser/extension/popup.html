<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tofu</title>
    <style>
      body { font: 13px system-ui, sans-serif; width: 280px; margin: 12px; }
      #tab { font-weight: 600; overflow-wrap: anywhere; }
      button { display: block; width: 100%; margin: 6px 0; padding: 6px; }
      #state, #failure { opacity: 0.75; overflow-wrap: anywhere; }
      code { user-select: all; }
    </style>
  </head>
  <body>
    <p id="tab"></p>
    <p id="mode"></p>
    <button id="read">Share to read</button>
    <button id="drive">Share to drive</button>
    <button id="stop">Stop sharing</button>
    <p id="state"></p>
    <p id="failure"></p>
    <script src="popup.js"></script>
  </body>
</html>
