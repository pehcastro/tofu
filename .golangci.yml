version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - unparam
    - misspell
    - gocritic
    - forbidigo
  settings:
    gocritic:
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          rules: ${base-path}/internal/platform/outside/rules.go
          failOn: all
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^exec\.Command(Context)?$
          pkg: ^os/exec$
          msg: run processes through outside.Command so the wall clock counts the wait
        - pattern: ^http\.(DefaultClient|Get|Head|Post|PostForm)$
          pkg: ^net/http$
          msg: build the client with outside.Client so the wall clock counts the wait
        - pattern: ^websocket\.Dial(er)?$
          pkg: ^(golang\.org/x/net|github\.com/gorilla)/websocket$
          msg: hold an outside.Wait around the dial so the wall clock counts the wait
  exclusions:
    rules:
      - path: _test\.go$
        linters: [forbidigo]
      - path: ^(bench|internal[/\\]platform[/\\]outside)[/\\]
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
